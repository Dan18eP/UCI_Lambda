services:
  # ============================================================================
  # 1. SERVING LAYER: PostgreSQL
  # Regla: Almacena exclusivamente vistas precomputadas (vitals_realtime, vitals_historico)
  # ============================================================================
  postgres-serving:
    image: postgres:15-alpine
    container_name: postgres-serving
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password}
      POSTGRES_DB: ${POSTGRES_DB:-serving_db}
    ports:
      - "5432:5432"
    volumes:
      - ./scripts/init_postgres.sql:/docker-entrypoint-initdb.d/init_postgres.sql:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d serving_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - uci_network

  # ============================================================================
  # 2. INGESTION LAYER: Apache Kafka (KRaft Mode - Cero ZooKeeper)
  # Cumple ADR-001: Reducción de 1.2 GB RAM, estándar de producción KRaft.
  # ============================================================================
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:29092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    healthcheck:
      test: ["CMD-SHELL", "kafka-cluster cluster-id --bootstrap-server localhost:9092 || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - uci_network

  kafka-init-topics:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-init-topics
    depends_on:
      - kafka
    entrypoint: [ '/bin/sh', '-c' ]
    command: |
      "
      # Esperar a que el broker Kafka esté disponible
      echo 'Esperando que Kafka KRaft esté listo...'
      cub kafka-ready -b kafka:9092 1 30
      
      # Crear el topic de telemetría de signos vitales UCI
      echo 'Creando topic vitals-stream (3 particiones, factor 1)...'
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic vitals-stream --partitions 3 --replication-factor 1
      
      echo 'Topic vitals-stream inicializado correctamente.'
      kafka-topics --bootstrap-server kafka:9092 --describe --topic vitals-stream
      "
    networks:
      - uci_network

  icu-producer:
    build:
      context: ./producer
      dockerfile: Dockerfile
    container_name: icu-producer
    depends_on:
      kafka-init-topics:
        condition: service_completed_successfully
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_TOPIC=vitals-stream
      - EMISSION_INTERVAL_SEC=1.0
    networks:
      - uci_network

  # ============================================================================
  # 3. BATCH MASTER DATASET: MinIO (S3 Compatible Data Lake)
  # Cumple ADR-002: Master Dataset Append-Only crudo. CERO patrón Medallón.
  # ============================================================================
  minio:
    image: bitnamilegacy/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
      - MINIO_DEFAULT_BUCKETS=data-lake
    volumes:
      - minio_data:/bitnami/minio/data
    networks:
      - uci_network

  # ============================================================================
  # 4. PROCESSING LAYER: Apache Spark (Speed & Batch Engine)
  # ============================================================================
  spark-master:
    image: apache/spark:3.5.0
    container_name: spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master --ip 0.0.0.0 --port 7077 --webui-port 8080
    ports:
      - "8080:8080"
      - "7077:7077"
    networks:
      - uci_network

  spark-worker:
    image: apache/spark:3.5.0
    container_name: spark-worker
    depends_on:
      - spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077 --webui-port 8081
    environment:
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=2G
    networks:
      - uci_network

  speed-layer-spark:
    build:
      context: ./speed_layer
      dockerfile: Dockerfile
    container_name: speed-layer-spark
    depends_on:
      kafka-init-topics:
        condition: service_completed_successfully
      minio:
        condition: service_started
      postgres-serving:
        condition: service_healthy
    ports:
      - "4040:4040"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_TOPIC=vitals-stream
      - POSTGRES_HOST=postgres-serving
      - POSTGRES_PORT=5432
      - POSTGRES_DB=serving_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres_password
      - FASTAPI_INTERNAL_URL=http://fastapi-backend:8000/api/v1/internal/vitals-stream
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
      - CHECKPOINT_LOCATION=s3a://data-lake/checkpoints/speed_vitals/
    networks:
      - uci_network

  # ============================================================================
  # 5. ORCHESTRATION LAYER: Apache Airflow (Batch Only)
  # Cumple ADR-003: Orquestación estricta de procesos Batch (volcado horario a MinIO).
  # Airflow NUNCA orquesta streaming.
  # ============================================================================
  airflow-init:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    container_name: airflow-init
    depends_on:
      postgres-serving:
        condition: service_healthy
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://postgres:postgres_password@postgres-serving:5432/airflow_db
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
    entrypoint: ["bash", "-c"]
    command: >
      "airflow db init &&
       airflow users create --username admin --firstname Admin --lastname UCI --role Admin --email admin@uci.local --password admin"
    networks:
      - uci_network

  airflow-webserver:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    container_name: airflow-webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://postgres:postgres_password@postgres-serving:5432/airflow_db
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__WEBSERVER__EXPOSE_CONFIG=True
      - AIRFLOW__WEBSERVER__BASE_URL=http://localhost:8085
      - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=False
    ports:
      - "8085:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./batch_layer:/opt/airflow/batch_layer
      - ./scripts:/opt/airflow/scripts
    command: webserver
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - uci_network

  airflow-scheduler:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    container_name: airflow-scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://postgres:postgres_password@postgres-serving:5432/airflow_db
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./batch_layer:/opt/airflow/batch_layer
      - ./scripts:/opt/airflow/scripts
    command: scheduler
    networks:
      - uci_network

  # ============================================================================
  # 6. GOVERNANCE LAYER: Apache Atlas (ADR-007)
  # Registro automatizado de linaje y metadatos vía API REST oficial
  # ============================================================================
  apache-atlas:
    image: sburn/apache-atlas:latest
    container_name: apache-atlas
    ports:
      - "21000:21000"
    environment:
      - MANAGE_LOCAL_HBASE=true
      - MANAGE_LOCAL_SOLR=true
    networks:
      - uci_network

  # ============================================================================
  # 7. SERVICE LAYER: FastAPI Backend (WebSockets + REST + Tabular ML <3ms)
  # Cumple ADR-005 y ADR-008.
  # ============================================================================
  fastapi-backend:
    build:
      context: ./serving_layer
      dockerfile: Dockerfile
    container_name: fastapi-backend
    depends_on:
      postgres-serving:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_HOST=postgres-serving
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres_password
      - POSTGRES_DB=serving_db
    networks:
      - uci_network

  # ============================================================================
  # 8. PRESENTATION LAYER: React Frontend (Cero Mocks & Auditor Bar)
  # Cumple ADR-006: React (Vite), visualización de 12 camas, sin datos falsos.
  # ============================================================================
  frontend-ui:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend-ui
    depends_on:
      - fastapi-backend
    ports:
      - "3000:3000"
    networks:
      - uci_network

networks:
  uci_network:
    name: uci_network
    driver: bridge

volumes:
  postgres_data:
  minio_data:
